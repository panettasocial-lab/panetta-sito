<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panetta — font pulsanti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@600;700&family=IM+Fell+English+SC&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/classico.css?v=8">
<style>
body{padding-bottom:4rem}
.intro{padding-block:2.4rem 1rem}
.intro h1{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:700}
.intro p{color:var(--muted);max-width:52ch;margin-top:.6rem}
.var{border-top:1px solid var(--line);padding-block:2rem 2.2rem}
.var__testa{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.var__lettera{font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--accent);line-height:1}
.var__nome{font-family:var(--f-display);font-weight:600;font-size:1.25rem;color:var(--ink)}
.var__nota{color:var(--muted);font-style:italic;font-size:1rem}
.prova{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.prova{grid-template-columns:1fr}}
.tav{padding:1.6rem 1.4rem;display:flex;flex-direction:column;gap:1.2rem;align-items:flex-start}
.tav--chiara{background:var(--surface);border:1px solid var(--line)}
.tav--scura{background:var(--ink);color:var(--cream)}
.tav .riga{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.finta-nav{display:flex;gap:1.4rem;align-items:center;font-family:var(--f-ui);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.tav--scura .btn--line{background:transparent;color:var(--cream);border-color:rgba(255,249,214,.6);outline-color:rgba(255,249,214,.2)}
.tav--scura .btn--line:hover{background:var(--cream);color:var(--ink)}
.tav--scura .btn--crema{outline-color:rgba(255,249,214,.3)}

/* font dei pulsanti per variante */
.var .btn{font-family:var(--fb)!important;font-size:var(--fs,.74rem);letter-spacing:var(--ls,.22em);font-weight:var(--fw,500);text-transform:var(--tt,uppercase);font-variation-settings:var(--fv,normal)}
.var .btn--sm{font-size:calc(var(--fs,.74rem) * .92)}
.v0{--fb:"EB Garamond",serif}
.v1{--fb:"Cormorant SC",serif;--fs:.86rem;--ls:.16em;--fw:700;--tt:none}
.v2{--fb:"IM Fell English SC",serif;--fs:.9rem;--ls:.1em;--fw:400;--tt:none}
.v3{--fb:"Fraunces",serif;--fs:.78rem;--ls:.12em;--fw:650;--fv:"SOFT" 100,"WONK" 0,"opsz" 14}
.v4{--fb:"Alegreya Sans SC",sans-serif;--fs:.82rem;--ls:.14em;--fw:700;--tt:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h1>Font per i pulsanti</h1>
    <p>Stessi pulsanti del sito, cambia solo il carattere. Titoli (Fraunces) e testi (EB Garamond) restano come sono.</p>
  </header>
</div>

<div class="wrap" id="lista"></div>

<template id="t">
  <section class="var">
    <div class="var__testa"><span class="var__lettera"></span><span class="var__nome"></span><span class="var__nota"></span></div>
    <div class="prova">
      <div class="tav tav--chiara">
        <div class="finta-nav">La Bakery<span>Il Panificio</span><a class="btn btn--sm" href="#">Chiamaci</a></div>
        <div class="riga"><a class="btn" href="#">Chiama</a><a class="btn btn--line" href="#">Il Panificio</a></div>
        <div class="riga"><a class="btn" href="#">Apri in Google Maps</a></div>
      </div>
      <div class="tav tav--scura">
        <div class="riga"><a class="btn btn--crema" href="#">Chiama 0861 1640185</a></div>
        <div class="riga"><a class="btn btn--line" href="#">Scrivici una mail</a><a class="btn btn--line" href="#">Menu asporto</a></div>
      </div>
    </div>
  </section>
</template>

<script>
const V=[
  ["v0","Ora","EB Garamond maiuscolo","quello di adesso: elegante ma sottile, a quella misura si perde"],
  ["v1","A","Cormorant SC","maiuscoletto classico, più inciso e nobile; da insegna di bottega storica"],
  ["v2","B","IM Fell English SC","caratteri da stampa a piombo del Seicento, irregolari: il più artigianale"],
  ["v3","C","Fraunces Soft","lo stesso dei titoli in versione morbida e piccola: tutto il sito con una voce sola"],
  ["v4","D","Alegreya Sans SC","maiuscoletto senza grazie ma calligrafico: più leggibile, stacca dai titoli senza diventare moderno"]
];
const t=document.getElementById("t"),L=document.getElementById("lista");
V.forEach(([c,l,n,d])=>{const s=t.content.cloneNode(true),sec=s.querySelector(".var");sec.classList.add(c);
  s.querySelector(".var__lettera").textContent=l;s.querySelector(".var__nome").textContent=n;s.querySelector(".var__nota").textContent=d;L.appendChild(s)});
document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
</script>
</body>
</html>
